<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>When Love Responds</title>
  <meta name="description" content="여섯 가지 사랑이 각자의 방식으로 응답하는 인터랙티브 미디어아트 〈When Love Responds〉" />
  <meta name="theme-color" content="#111113" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%225%22 fill=%22%23ece9e4%22/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    /* 안전장치: 어떤 브라우저에서 스크립트가 멈춰도 3초 뒤 갤러리는 반드시 보이게 */
    setTimeout(function () { document.documentElement.classList.add('is-ready'); }, 3000);
    window.addEventListener('error', function (e) {
      document.documentElement.classList.add('is-ready');
      try { console.error('[WLR]', e.message, e.filename, e.lineno); } catch (_) {}
    });
  </script>
  <script src="/works.js"></script>
</head>
<body>
  <main class="gallery" id="gallery" aria-label="When Love Responds 전시 갤러리">
    <header class="masthead">
      <h1 class="title">When Love Responds</h1>
      <p class="intro">여섯 가지 사랑이, 각자의 방식으로 응답합니다.<span class="intro-en">Choose the love that calls to you.</span></p>
    </header>

    <ul class="works" id="works" aria-label="작품 목록"></ul>

  </main>

  <!-- 작품 뷰어 (openMode: frame) -->
  <section class="viewer" id="viewer" aria-hidden="true">
    <button class="back" id="back" type="button" aria-label="갤러리로 돌아가기"><span class="back-arrow" aria-hidden="true">←</span>BACK TO GALLERY</button>
  </section>

  <!-- 전체화면 버튼: 갤러리와 작품 화면 모두 오른쪽 위 -->
  <button class="enter" id="enter" type="button" aria-label="전체화면" title="전체화면" hidden>
    <svg class="fs-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
    <svg class="fs-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
  </button>

  <script src="/app.js"></script>
</body>
</html>
